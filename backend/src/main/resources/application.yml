spring:
  datasource:
    url: jdbc:mysql://localhost:3306/forum?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: 你的MySQL账号
    password: 你的MySQL密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  rabbitmq:
    host: localhost
    port: 5672
    username: 你的RabbitMQ用户名
    password: 你的RabbitMQ密码

  ai:
    openai:
      api-key: 你的AI接口密钥
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: Qwen/Qwen3-8B

  mail:
    host: smtp.qq.com
    port: 587
    username: 你的QQ邮箱
    password: 你的邮箱授权码
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  upload:
    dir: 你的图片上传目录

qweather:
  host: 你的和风天气APIHost
  kid: 你的凭据ID
  sub: 你的项目ID
  iss: 你的开发者ID
  private-key-path: 你的私钥文件路径

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
